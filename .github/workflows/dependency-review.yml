name: Dependency Review

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OSV PR Gate
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.5
        with:
          fail-on-severity: high
          fail-on-vuln: true
          scan-args: |-
            --recursive
            .
            --allow-no-lockfiles
